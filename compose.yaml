services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bot_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  bot_data:
